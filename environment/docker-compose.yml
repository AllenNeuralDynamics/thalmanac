services:
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ..:/root/capsule:cached
      - /mnt/data:/data/abc_atlas
    depends_on:
      - rclone
    command: streamlit run /root/capsule/code/streamlit_app.py
    
  rclone:
    image: rclone/rclone:latest
    volumes:
      - /mnt/data:/data/abc_atlas:rshared
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    command: [
      "mount", 
      ":s3:allen-brain-cell-atlas", "/data/abc_atlas", 
      "--allow-non-empty",
      "--allow-other",
      "--s3-provider", "AWS",
      "--s3-region", "us-west-2",
      "--read-only", 
      "--vfs-cache-mode", "full", 
      "--vfs-cache-max-size", "100g", 
      "--vfs-read-ahead", "64m", 
      "--buffer-size", "32m", 
      "--dir-cache-time", "1h", 
      "--no-checksum", 
      "--poll-interval", "0", 
      "--checkers", "36"
    ]